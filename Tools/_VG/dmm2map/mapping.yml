# vg13 type -> SS14 prototype. Longest matching path prefix wins ("/obj/structure/window/reinforced" beats
# "/obj/structure"). `drop: true` discards the atom without a warning; atoms with no rule are dropped and listed in the
# converter's report.
#
# rot: "dir" turns the atom to its BYOND dir var (1 north, 2 south, 4 east, 8 west).

tiles:
  /turf/space: {tile: Space}
  /turf/simulated/floor: {tile: FloorSteel}
  /turf/simulated/floor/plating: {tile: Plating}
  /turf/simulated/floor/airless: {tile: FloorSteel}
  /turf/simulated/floor/plating/airless: {tile: Plating}
  /turf/simulated/floor/engine: {tile: FloorReinforced}
  /turf/simulated/floor/bluegrid: {tile: FloorBlueCircuit}
  /turf/simulated/floor/wood: {tile: FloorWood}
  /turf/simulated/floor/carpet: {tile: FloorCarpetOffice}
  /turf/simulated/floor/grass: {tile: FloorGrass}
  /turf/simulated/floor/shuttle: {tile: FloorShuttleWhite}
  /turf/simulated/floor/shuttle/plating: {tile: Plating}
  /turf/simulated/floor/glass: {tile: FloorGlass}
  /turf/simulated/floor/arcade: {tile: FloorArcadeBlue}
  /turf/simulated/wall: {tile: Plating, proto: WallSolid}
  /turf/simulated/wall/r_wall: {tile: Plating, proto: WallReinforced}
  /turf/simulated/wall/shuttle: {tile: Plating, proto: WallShuttle}

atoms:
  /area: {drop: true}
  /obj/effect/decal: {drop: true}
  /obj/effect/landmark: {drop: true}
  /obj/abstract: {drop: true}
  /obj/structure/sign: {drop: true}

  /obj/structure/grille: {proto: Grille}
  /obj/structure/lattice: {tile: Lattice}
  /obj/structure/catwalk: {proto: Catwalk}
  /obj/structure/window/reinforced: {proto: WindowReinforcedDirectional, rot: dir}
  /obj/structure/window/reinforced/plasma: {proto: PlasmaReinforcedWindowDirectional, rot: dir}
  /obj/structure/window/full/reinforced: {proto: ReinforcedWindow}
  /obj/structure/window/full/reinforced/plasma: {proto: ReinforcedPlasmaWindow}
  /obj/structure/window/full/reinforced/tinted: {proto: ReinforcedWindow}

  /obj/structure/table: {proto: Table}
  /obj/structure/table/woodentable: {proto: TableWood}
  /obj/structure/table/reinforced: {proto: TableReinforced}
  /obj/structure/table/glass: {proto: TableGlass}
  /obj/structure/rack: {proto: Rack}
  /obj/structure/bed: {proto: Bed}
  /obj/structure/bed/chair: {proto: Chair, rot: dir}
  /obj/structure/bed/chair/comfy: {proto: ChairOfficeDark, rot: dir}
  /obj/structure/bed/chair/office: {proto: ChairOfficeLight, rot: dir}
  /obj/structure/closet: {proto: ClosetSteelBase}
  /obj/structure/closet/emcloset: {proto: ClosetEmergency}
  /obj/structure/flora/pottedplant: {proto: PottedPlantRandom}
  /obj/structure/extinguisher_cabinet: {proto: ExtinguisherCabinetFilled, rot: dir}

  /obj/machinery/door/airlock: {proto: Airlock}
  /obj/machinery/door/airlock/glass: {proto: AirlockGlass}
  /obj/machinery/door/airlock/maintenance: {proto: AirlockMaintLocked}
  /obj/machinery/door/airlock/external: {proto: AirlockExternal}
  /obj/machinery/door/firedoor/border_only: {proto: FirelockGlass, rot: dir}
  /obj/machinery/door/poddoor: {proto: BlastDoor}

  /obj/machinery/light: {proto: PoweredlightLED, rot: dir}
  /obj/machinery/light/small: {proto: SmallLight, rot: dir}
  /obj/machinery/camera: {proto: SurveillanceCameraGeneral, rot: dir}
  /obj/machinery/alarm: {proto: AirAlarm, rot: dir}
  /obj/machinery/firealarm: {proto: FireAlarm, rot: dir}
  /obj/machinery/power/apc: {proto: APCBasic, rot: dir}
  /obj/machinery/power/solar/panel: {proto: SolarPanel}
  /obj/structure/cable: {cable: true}

  # Pipes: the shape and rotation come from the vg13 dir; colours are vg13's pipe colours.
  /obj/machinery/atmospherics/pipe/simple: {pipe: simple, color: "#B4B4B4"}
  /obj/machinery/atmospherics/pipe/simple/supply: {pipe: simple, color: "#0000B7"}
  /obj/machinery/atmospherics/pipe/simple/scrubbers: {pipe: simple, color: "#B70000"}
  /obj/machinery/atmospherics/pipe/simple/cyan: {pipe: simple, color: "#00B8B8"}
  /obj/machinery/atmospherics/pipe/simple/filtering: {pipe: simple, color: "#00B900"}
  /obj/machinery/atmospherics/pipe/simple/yellow: {pipe: simple, color: "#B77900"}
  /obj/machinery/atmospherics/pipe/simple/insulated: {pipe: simple, color: "#B4B4B4"}
  /obj/machinery/atmospherics/pipe/simple/heat_exchanging: {pipe: simple, color: "#B77900"}
  /obj/machinery/atmospherics/pipe/simple/supply/hidden/layered: {drop: true}
  /obj/machinery/atmospherics/pipe/simple/supply/visible/layered: {drop: true}
  /obj/machinery/atmospherics/pipe/simple/scrubbers/visible/layered: {drop: true}
  /obj/machinery/atmospherics/pipe/simple/general/visible/layered: {drop: true}
  /obj/machinery/atmospherics/pipe/manifold: {pipe: manifold, color: "#B4B4B4"}
  /obj/machinery/atmospherics/pipe/manifold/supply: {pipe: manifold, color: "#0000B7"}
  /obj/machinery/atmospherics/pipe/manifold/scrubbers: {pipe: manifold, color: "#B70000"}
  /obj/machinery/atmospherics/pipe/manifold/cyan: {pipe: manifold, color: "#00B8B8"}
  /obj/machinery/atmospherics/pipe/manifold/insulated: {pipe: manifold, color: "#B4B4B4"}
  /obj/machinery/atmospherics/pipe/manifold4w: {pipe: manifold4w, color: "#B4B4B4"}
  /obj/machinery/atmospherics/pipe/manifold4w/supply: {pipe: manifold4w, color: "#0000B7"}
  /obj/machinery/atmospherics/pipe/manifold4w/scrubbers: {pipe: manifold4w, color: "#B70000"}
  /obj/machinery/atmospherics/pipe/cap: {pipe: unary, color: "#B4B4B4"}
  /obj/machinery/atmospherics/unary/vent_pump: {proto: GasVentPump, rot: dir}
  /obj/machinery/atmospherics/unary/vent_scrubber: {proto: GasVentScrubber, rot: dir}
  /obj/machinery/atmospherics/unary/portables_connector: {proto: GasPort, rot: dir}
  # Devices that sit in a pipe line. vg13's binary devices take gas in opposite their dir and put it out along it, which
  # is SS14's inlet/outlet orientation at rotation 0 (facing south). Pumps start off and valves closed, as in vg13.
  /obj/machinery/atmospherics/binary/pump: {proto: GasPressurePump, rot: dir, enabled: GasPressurePump}
  /obj/machinery/atmospherics/binary/volume_pump: {proto: GasVolumePump, rot: dir, enabled: GasVolumePump}
  /obj/machinery/atmospherics/binary/valve: {proto: GasValve, rot: dir, valve: true}
  /obj/machinery/atmospherics/binary/valve/digital: {proto: SignalControlledValve, rot: dir}
  /obj/machinery/atmospherics/binary/dp_vent_pump: {proto: GasDualPortVentPump, rot: dir}
  /obj/machinery/atmospherics/trinary/filter: {proto: GasFilter, rot: dir}
  /obj/machinery/atmospherics/trinary/filter/mirrored: {proto: GasFilterFlipped, rot: dir}
  /obj/machinery/atmospherics/trinary/mixer: {proto: GasMixer, rot: dir}
  /obj/machinery/atmospherics/trinary/mixer/mirrored: {proto: GasMixerFlipped, rot: dir}
  /obj/machinery/atmospherics/unary/outlet_injector: {proto: GasOutletInjector, rot: dir}
  /obj/machinery/atmospherics/unary/vent: {proto: GasPassiveVent, rot: dir}
  /obj/machinery/atmospherics/unary/cold_sink/freezer: {proto: GasThermoMachineFreezer, rot: dir}

  # SMES: handled in wire_smes (substation, HV side, terminal), not placed directly.
  /obj/machinery/power/battery/smes: {proto: SMESBasic, smes: true}
  /obj/machinery/power/terminal: {proto: CableTerminal, terminal: true, rot: dir}
  /obj/machinery/disposal: {proto: DisposalUnit}
  /obj/machinery/newscaster: {drop: true}
  /obj/machinery/status_display: {drop: true}
  /obj/machinery/light_switch: {drop: true}
  /obj/machinery/hologram/holopad: {drop: true}
  /obj/item/device/radio/intercom: {proto: IntercomCommon, rot: dir}

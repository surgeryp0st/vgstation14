# VG: the body parts use vg13's species sprites (Resources/Textures/_VG/mob/human_races, made with Tools/_VG/species_rsi.py).
- type: species
  id: Vox
  name: species-name-vox
  roundStart: true
  prototype: MobVox
  sprites: MobVoxSprites
  markingLimits: MobVoxMarkingLimits
  dollPrototype: MobVoxDummy
  skinColoration: TintedHues # VG: vg13 sprites keep their own colours
  defaultSkinTone: "#ffffff" # VG: vg13 sprites keep their own colours
  maleFirstNames: names_vox
  femaleFirstNames: names_vox
  naming: First

- type: speciesBaseSprites
  id: MobVoxSprites
  sprites:
    Head: MobVoxHead
    Snout: MobHumanoidAnyMarking
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Chest: MobVoxTorso
    Eyes: MobVoxEyes
    LArm: MobVoxLArm
    RArm: MobVoxRArm
    LHand: MobVoxLHand
    RHand: MobVoxRHand
    LLeg: MobVoxLLeg
    RLeg: MobVoxRLeg
    LFoot: MobVoxLFoot
    RFoot: MobVoxRFoot
    Tail: MobHumanoidAnyMarking

- type: markingPoints
  id: MobVoxMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Head:
      points: 1
      required: true
    Snout:
      points: 1
      required: true
      defaultMarkings: [ VoxBeak ]
    Arms:
      points: 4
      required: true
      defaultMarkings: [ VoxLArmScales, VoxRArmScales, VoxRHandScales, VoxLHandScales ]
    Legs:
      points: 4
      required: true
      defaultMarkings: [ VoxLLegScales, VoxRLegScales, VoxRFootScales, VoxLFootScales ]
    Chest:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ VoxTail ]

- type: humanoidBaseSprite
  id: MobVoxEyes
  baseSprite:
    sprite: Mobs/Species/Vox/parts.rsi
    state: eyes


  - { desc: vg-wound-cut-deep-3, damage: 15 }
  - { desc: vg-wound-cut-deep-4, damage: 8 }
  - { desc: vg-wound-cut-deep-5, damage: 2 }
  - { desc: vg-wound-fresh-skin, damage: 0 }


# Bruises all share one stage list and start at different stages.

- type: vgWound
  abstract: true
  id: BaseBruise
  damageType: Bruise
  needsTreatment: true
  stages:
  - { desc: vg-wound-bruise-1, damage: 80 }
  - { desc: vg-wound-bruise-2, damage: 50 }
  - { desc: vg-wound-bruise-3, damage: 30 }
  - { desc: vg-wound-bruise-4, damage: 20 }
  - { desc: vg-wound-bruise-5, damage: 10 }
  - { desc: vg-wound-bruise-6, damage: 5 }

- type: vgWound
  parent: BaseBruise
  id: BruiseTiny
  startStage: 6
  needsTreatment: false

- type: vgWound
  parent: BaseBruise
  id: BruiseSmall
  startStage: 5
  needsTreatment: false

- type: vgWound
  parent: BaseBruise
  id: BruiseModerate
  startStage: 4
  needsTreatment: false

- type: vgWound
  parent: BaseBruise
  id: BruiseLarge
  startStage: 3

- type: vgWound
  parent: BaseBruise
  id: BruiseHuge
  startStage: 2

- type: vgWound
  parent: BaseBruise
  id: BruiseMonumental


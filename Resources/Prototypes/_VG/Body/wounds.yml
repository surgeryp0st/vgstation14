# Internal bleeding: doesn't count towards limb damage and only heals through surgery.

- type: vgWound
  id: InternalBleeding
  damageType: Cut
  internal: true
  maxBleedingStage: 0
  needsTreatment: true
  stages:
  - { desc: vg-wound-internal-1, damage: 30 }
  - { desc: vg-wound-internal-2, damage: 20 }
  - { desc: vg-wound-internal-3, damage: 10 }
  - { desc: vg-wound-internal-4, damage: 5 }

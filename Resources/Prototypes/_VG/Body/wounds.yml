# vgstation13 wounds (code/modules/organs/wound.dm). Stages go from worst to best; the number is the
# damage per wound at which the stage starts. New wounds pick a size by damage (see VgBodySystem).

# Cuts

- type: vgWound
  id: CutSmall
  damageType: Cut
  maxBleedingStage: 2
  stages:
  - { desc: vg-wound-cut-small-1, damage: 20 }
  - { desc: vg-wound-cut-small-2, damage: 10 }
  - { desc: vg-wound-cut-small-3, damage: 5 }
  - { desc: vg-wound-cut-small-4, damage: 2 }
  - { desc: vg-wound-cut-small-5, damage: 0 }

- type: vgWound
  id: CutDeep
  damageType: Cut
  maxBleedingStage: 3
  stages:

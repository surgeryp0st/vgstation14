- type: entity
  save: false
  name: Urist McHands
  parent: BaseMobSpeciesOrganic
  id: BaseMobGrey
  abstract: true
  components:
  - type: Icon
    sprite: _VG/mob/human_races/grey.rsi
    state: full
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: HumanoidAppearance
    species: Grey
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  # VG: vg13 species numbers.
  - type: VgSpecies
    species: Grey
  # VG: water splashed on a Grey burns (vg13 ACID4WATER). The first reaction is SS14's, repeated because a child's
  # reactions replace its parent's.
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [ Touch, Ingestion ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPieReaction
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:VgGreyWaterSplash


# vg13's plasmaman containment gear. The variants are generated into plasmaman.yml by Tools/_VG/plasmaman_gear.py.
- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: VgPlasmamanSuitBase
  name: plasmaman suit
  description: A special containment suit designed to protect a plasmaman's volatile body from outside exposure and quickly extinguish it in emergencies.
  components:
  - type: Item
    size: Large
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: VgPlasmaContainment
    regulates: true

- type: entity
  abstract: true
  parent: ClothingHeadHardsuitWithLightBase
  id: VgPlasmamanHelmetBase
  name: plasmaman helmet
  description: A special containment helmet designed to protect a plasmaman's volatile body from outside exposure and quickly extinguish it in emergencies.
  categories: [ ]
  components:
  - type: VgPlasmaContainment

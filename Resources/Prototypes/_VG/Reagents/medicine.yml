# The face repair at tick 16+ waits for disfigurement. Its recipe (carpotoxin, cryptobiolin, copper) waits for those.
- type: reagent
  id: rezadone
  name: reagent-name-vg-rezadone
  group: Medicine
  desc: reagent-desc-vg-rezadone
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#669900"

- type: vgReagent
  id: rezadone
  overdoseAmount: 30
  overdoseTick: 35
  effects:
  - !type:VgAdjustDamage
    type: Clone
    amount: -1
    maxTick: 15
  - !type:VgHealOrgan
    brute: 1
    burn: 1
    maxTick: 15
  - !type:VgAdjustDamage
    type: Clone
    amount: -2
    minTick: 16
    maxTick: 35
  - !type:VgHealOrgan
    brute: 2
    burn: 1
    minTick: 16
    maxTick: 35

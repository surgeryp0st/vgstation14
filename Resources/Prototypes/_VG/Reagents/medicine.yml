# vgstation13 medicines (code/modules/reagents/reagents/reagents_medical.dm). The reagent is an ordinary SS14 reagent so
# containers, reactions and machines work; its Life() behaviour is in the matching vgReagent. Ids are vg13's (lowercase),
# which don't collide with SS14's CamelCase ones.
# Not ported yet: drowsiness, hallucination and virus effects, which wait on those systems.

- type: reagent
  id: anti_toxin
  name: reagent-name-vg-anti-toxin
  group: Medicine
  desc: reagent-desc-vg-anti-toxin
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#C8A5DC"

- type: vgReagent
  id: anti_toxin
  overdoseAmount: 60
  effects:
  - !type:VgRemoveReagents
    reagents: [toxin, plantbgone, insecticide, solanine, stoxin, cyanide, amatoxin, potassium_hydroxide]
    amount: 2
  - !type:VgRemoveReagents
    reagents: [plasma, sacid, sux, carpotoxin]
    amount: 1
  - !type:VgRemoveReagents
    reagents: [chloralhydrate]
    amount: 5
  - !type:VgRemoveReagents
    reagents: [mindbreaker]
    amount: 2
  - !type:VgRemoveReagents
    reagents: [zombiepowder]
    amount: 0.5
  - !type:VgAdjustDamage
    type: Toxin
    amount: -2


# vg13 toxins (reagents_toxin.dm). Reagents both games have keep SS14's id and get vg13's behaviour through a
# vgReagent of the same id; vg13-only ones are new reagents. Left out for now: chloramine's lung damage on contact and
# mercury's space-drifting and emotes, which wait for the systems they need.

- type: vgReagent
  id: Toxin
  metabolism: 0.01
  effects:
  - !type:VgAdjustDamage
    type: Toxin
    amount: 0.2
    flat: true

- type: vgReagent
  id: CarpoToxin
  effects:
  - !type:VgAdjustDamage
    type: Toxin
    amount: 2

- type: vgReagent
  id: Amatoxin
  effects:
  - !type:VgAdjustDamage
    type: Toxin
    amount: 1.5
    flat: true

- type: vgReagent
  id: Mercury
  overdoseAmount: 30
  effects:
  - !type:VgAdjustBrainLoss
    amount: 4

- type: reagent
  id: cyanide
  name: reagent-name-vg-cyanide
  group: Toxins
  desc: reagent-desc-vg-cyanide
  physicalDesc: reagent-physical-desc-translucent
  flavor: bitter
  color: "#CF3600"

- type: vgReagent
  id: cyanide
  metabolism: 0.4
  effects:
  - !type:VgAdjustDamage
    type: Toxin
    amount: 4
    flat: true
  - !type:VgAdjustDamage
    type: Oxygen
    amount: 4
    flat: true
  - !type:VgStatusEffect
    kind: Sleep
    ticks: 1
    add: true

- type: reagent
  id: chloramine
  name: reagent-name-vg-chloramine
  group: Toxins
  desc: reagent-desc-vg-chloramine
  physicalDesc: reagent-physical-desc-gaseous
  flavor: bitter
  color: "#808080"

- type: vgReagent
  id: chloramine
  overdoseAmount: 30
  effects:
  - !type:VgAdjustDamage
    type: Brute
    amount: 1

- type: reagent
  id: potassium_hydroxide
  name: reagent-name-vg-potassium-hydroxide
  group: Toxins
  desc: reagent-desc-vg-potassium-hydroxide
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#FFFFFF"

- type: vgReagent
  id: potassium_hydroxide
  metabolism: 0.1
  overdoseAmount: 30
  effects:
  - !type:VgAdjustDamage
    type: Burn
    amount: 1.5

# vg13 sleep toxin: blurry eyes, then drowsy, then out cold for as long as it lasts; after 8 minutes it starts
# wearing out the heart.
- type: reagent
  id: stoxin
  name: reagent-name-vg-stoxin
  group: Toxins
  desc: reagent-desc-vg-stoxin
  physicalDesc: reagent-physical-desc-translucent
  flavor: bitter
  color: "#E895CC"

- type: vgReagent
  id: stoxin
  metabolism: 0.1
  overdoseAmount: 30
  effects:
  - !type:VgStatusEffect
    kind: Blur
    ticks: 10
    minTick: 1
    maxTick: 15
  - !type:VgStatusEffect
    kind: Drowsiness
    ticks: 20
    minTick: 16
    maxTick: 25
  - !type:VgStatusEffect
    kind: Paralyse
    ticks: 20
    minTick: 26
    maxTick: 240
  - !type:VgStatusEffect
    kind: Drowsiness
    ticks: 30
    minTick: 26
    maxTick: 240
  - !type:VgDamageOrgan
    organ: heart
    amount: 10
    minTick: 241

# vg13 suxameth (suxamethonium chloride): a full-body paralytic that's easy to purge; past 20 units it paralyses the
# diaphragm too.
- type: reagent
  id: suxameth
  name: reagent-name-vg-suxameth
  group: Toxins
  desc: reagent-desc-vg-suxameth
  physicalDesc: reagent-physical-desc-translucent
  flavor: bitter
  color: "#CFC5E9"

- type: vgReagent
  id: suxameth
  metabolism: 1
  overdoseAmount: 21
  effects:
  - !type:VgStatusEffect
    kind: Stun
    ticks: 2
    minTick: 2
  - !type:VgStatusEffect
    kind: Knockdown
    ticks: 2
    minTick: 2
  overdoseEffects:
  - !type:VgAdjustDamage
    type: Oxygen
    amount: 6
    flat: true

# vg13 heartbreaker toxin: suffocates. Its hallucinations wait for vg13 hallucinations.
- type: vgReagent
  id: HeartbreakerToxin
  effects:
  - !type:VgAdjustDamage
    type: Oxygen
    amount: 4

# vg13 chloral hydrate: a jolt of confusion and drowsiness, then asleep for as long as it lasts; past 80 ticks it
# poisons harder and harder.
- type: vgReagent
  id: ChloralHydrate
  effects:
  - !type:VgStatusEffect
    kind: Confused
    ticks: 2
    add: true
    maxTick: 0
  - !type:VgStatusEffect
    kind: Drowsiness
    ticks: 2
    add: true
    maxTick: 0
  - !type:VgStatusEffect
    kind: Sleep
    ticks: 1
    add: true
    minTick: 1
  - !type:VgAdjustDamage
    type: Toxin
    amount: -50
    perTick: 1
    flat: true
    minTick: 80

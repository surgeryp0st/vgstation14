# vg13 nutriment_factor for the food and drink reagents both games have (reagents_food.dm, reagents_drink.dm,
# reagents_ethanol.dm; factor * REAGENTS_METABOLISM), attached to SS14's reagent ids. SS14 has Protein, Fat and
# Vitamin where vg13 only has nutriment, so they feed like nutriment does. The juices, cocoa, soy milk, butter and egg are vg13's
# apple juice, coco, soymilk, liquid butter and egg yolk under SS14's names; other renamed ones are still to be matched up.


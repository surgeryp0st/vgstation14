# vg13's plasmaman job outfits (code/datums/outfit/*.dm, the /datum/species/plasmaman lists): the job's containment suit
# and helmet, a breath mask, the plasma tank on internals, and a plasmaman survival box. SS14 jobs map to the closest vg13 job.
# Not abstract: StartingGearPrototype's abstract flag can't be set from YAML, and children of an abstract gear don't load.
- type: startingGear
  id: VgPlasmamanGearBase
  equipment:
    mask: ClothingMaskBreath
    suitstorage: VgPlasmamanTankFilled
  storage:
    back:
    - VgBoxSurvivalPlasmaman

- type: vgSpeciesGear
  id: VgPlasmamanGearGeneric
  species: Plasmaman
  default: true
  gear: VgPlasmamanGearGenericStarting

- type: startingGear
  id: VgPlasmamanGearGenericStarting
  parent: VgPlasmamanGearBase
  equipment:
    head: VgPlasmamanHelmet
    outerClothing: VgPlasmamanSuit

